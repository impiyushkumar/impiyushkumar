name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#2f5bff&color_dots=#ebedf0,#c6d4ff,#93acff,#5f84ff,#2f5bff
            dist/snake-dark.svg?palette=github-dark&color_snake=#7d9bff&color_dots=#161b22,#1a2240,#2c3d7a,#4f6fd6,#7d9bff
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
